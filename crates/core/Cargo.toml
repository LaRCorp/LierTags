[package]
name = "liertags-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["LaRevole"]
description = "Core tag processing, audio metadata models, and HTTP import server for LierTags"

[dependencies]
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "net", "macros"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
ureq = { version = "3.5", default-features = false, features = ["gzip", "json", "rustls"] }
thiserror = "2.0"
anyhow = "1.0"
walkdir = "2.5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.41", features = ["bundled"] }
dirs = "7.0"
rayon = "1.10"

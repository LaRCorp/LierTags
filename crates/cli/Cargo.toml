[package]
name = "liertags-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["LaRevole"]
description = "CLI prototype and tag manipulation tool for LierTags"

[dependencies]
liertags-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"
anyhow = "1.0"
